[package]
name = "zine_maker"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "zine_maker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# protocol-asset: required because tauri.conf.json enables app.security.assetProtocol (used to
# serve arbitrary local image files the user picks via the native file dialog).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to 0.24 (not the newer 0.25) to match printpdf 0.7's own internal `image` dependency
# exactly — from_dynamic_image() takes printpdf's re-exported image::DynamicImage, and Cargo
# only unifies the two into one crate instance (making the types the same type) if the version
# requirements actually overlap.
image = "0.24"
printpdf = { version = "0.7", features = ["embedded_images"] }
uuid = { version = "1", features = ["v4", "serde"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
